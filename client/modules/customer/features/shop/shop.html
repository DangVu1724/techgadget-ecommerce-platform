<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop - TechGadget</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="/modules/customer/features/shop/shop.css" />
  </head>
  <body>
    <!-- Filter Overlay (Backdrop) -->
    <div class="filter-overlay" id="filterOverlay"></div>
    
    <div class="container">
      <nav class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb">
        <a href="/" aria-label="Home">
          <i class="fas fa-home"></i>
        </a>
      </nav>

      <div class="shop-promo-banner">
        <div class="promo-badge">
          <i class="fas fa-lightning-bolt"></i>
          FLASH SALE
        </div>
        <div class="promo-message">
          Sales up to: <strong>50%</strong> for selected products. Don't miss out!
        </div>
        <button class="promo-cta">Watch now</button>
      </div>

      <div class="category-brands-wrapper" id="categoryBrandsWrapper">
        <h3>Categories</h3>
        <div id="categoryBrandList" class="brand-list"></div>
      </div>

      <div class="filter-bar">
        <div class="filter-left">
          <span class="filter-label">
            <i class="fas fa-list"></i>
            <span id="filterLabel">Show all products</span>
          </span>
        </div>
        <div class="filter-right">
          <div class="filter-dropdown" id="filterDropdown">
            <button
              class="toggle-filters"
              id="toggleFilters"
              type="button"
              aria-expanded="false"
              aria-controls="advancedFilters"
            >
              <span class="toggle-filters-text">
                <i class="fas fa-sliders-h"></i>
                <span>Advanced filters</span>
              </span>
              <span class="filter-badge" id="filterBadge">0</span>
              <i class="fas fa-chevron-down"></i>
            </button>

            <!-- Modern Advanced Filters Panel -->
            <div class="advanced-filters" id="advancedFilters">
              <!-- Header -->
              <div class="filter-panel-header">
                <div class="filter-panel-title-group">
                  <h2>
                    <i class="fas fa-sliders-h"></i>
                    Filter Products
                  </h2>
                  <p id="filterSummary" class="filter-summary">No filters selected</p>
                </div>
                <button 
                  type="button" 
                  class="filter-panel-close" 
                  id="closeFilters" 
                  aria-label="Close filters"
                >
                  <i class="fas fa-times"></i>
                </button>
              </div>

              <!-- Scrollable Content -->
              <div class="filter-panel-scroll">
                <div class="filter-panel-content">
                  <!-- Price Range Section -->
                  <div class="filter-section collapsed">
                    <div class="filter-section-header">
                      <h3>
                        <i class="fas fa-tag"></i>
                        Price Range
                      </h3>
                      <i class="fas fa-chevron-down"></i>
                    </div>
                    <div class="filter-content">
                      <div class="price-range-container">
                        <div class="price-inputs">
                          <input
                            type="number"
                            id="minPrice"
                            placeholder="Min price"
                            min="0"
                            class="price-input"
                          />
                          <span class="price-separator">to</span>
                          <input
                            type="number"
                            id="maxPrice"
                            placeholder="Max price"
                            min="0"
                            class="price-input"
                          />
                        </div>
                      </div>
                      <div class="price-presets">
                        <button
                          type="button"
                          class="price-preset"
                          data-min="0"
                          data-max="2300000"
                        >
                          <span class="preset-label" style="font-family: 'Poppins', sans-serif;">Under 2.3m ₫</span>
                        </button>
                        <button
                          type="button"
                          class="price-preset"
                          data-min="2300000"
                          data-max="11500000"
                        >
                          <span class="preset-label" style="font-family: 'Poppins', sans-serif;">2.3m - 11.5m ₫</span>
                        </button>
                        <button
                          type="button"
                          class="price-preset"
                          data-min="11500000"
                          data-max="23000000"
                        >
                          <span class="preset-label" style="font-family: 'Poppins', sans-serif;">11.5m - 23m ₫</span>
                        </button>
                        <button
                          type="button"
                          class="price-preset"
                          data-min="23000000"
                          data-max="99999999"
                        >
                          <span class="preset-label" style="font-family: 'Poppins', sans-serif;">Over 23m ₫</span>
                        </button>
                      </div>
                    </div>
                  </div>

                  <!-- Dynamic Filter Sections -->
                  <div id="dynamicFilterSections"></div>
                </div>
              </div>

              <!-- Footer with Actions -->
              <div class="filter-panel-footer">
                <button id="clearFilters" type="button" class="btn-clear">
                  <i class="fas fa-redo"></i>
                  Clear All
                </button>
                <button id="applyFilters" type="button" class="btn-apply">
                  <i class="fas fa-check"></i>
                  Apply Filters
                </button>
              </div>
            </div>
          </div>

          <div class="sort-dropdown">
            <select
              id="sortSelect"
              class="sort-select"
              aria-label="Sort products"
            >
              <option value="default">Sort by: Default</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="name-asc">Name: A-Z</option>
              <option value="name-desc">Name: Z-A</option>
              <option value="newest">Newest</option>
            </select>
          </div>
        </div>
      </div>

      <div id="shopSkeleton" class="skeleton-grid hidden">
        <div class="skeleton-card">
          <div class="skeleton-box"></div>
          <div class="skeleton-line short"></div>
          <div class="skeleton-line medium"></div>
          <div class="skeleton-line long"></div>
        </div>
        <div class="skeleton-card">
          <div class="skeleton-box"></div>
          <div class="skeleton-line short"></div>
          <div class="skeleton-line medium"></div>
          <div class="skeleton-line long"></div>
        </div>
        <div class="skeleton-card">
          <div class="skeleton-box"></div>
          <div class="skeleton-line short"></div>
          <div class="skeleton-line medium"></div>
          <div class="skeleton-line long"></div>
        </div>
        <div class="skeleton-card">
          <div class="skeleton-box"></div>
          <div class="skeleton-line short"></div>
          <div class="skeleton-line medium"></div>
          <div class="skeleton-line long"></div>
        </div>
        <div class="skeleton-card">
          <div class="skeleton-box"></div>
          <div class="skeleton-line short"></div>
          <div class="skeleton-line medium"></div>
          <div class="skeleton-line long"></div>
        </div>
      </div>

      <div id="productList" class="grid-5"></div>

      <p id="emptyMessage" class="empty-message">
        <i class="fas fa-search"></i> No matching products found
      </p>

      <div id="pagination" class="pagination"></div>
    </div>

    <script
      type="module"
      src="/modules/customer/features/shop/js/shop.js"
    ></script>
    <script type="module" src="/modules/customer/assets/js/header.js"></script>
    <script type="module" src="/modules/customer/assets/js/footer.js"></script>
    <button id="backToTop" title="Lên đầu trang">
    <span class="arrow"></span>
    </button>
  </body>
</html>
