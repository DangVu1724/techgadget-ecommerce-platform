<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop - TechGadget</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Poppins:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="/modules/customer/features/shop/shop.css" />
  </head>
  <body>
    <div class="container">
      <nav class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb">
        <a href="/" aria-label="Trang chá»§">
          <i class="fas fa-home"></i>
        </a>
      </nav>

      <div class="shop-search-box">
        <form id="shop-search-form">
          <input
            type="text"
            id="shop-search-input"
            placeholder="TÃ¬m kiáº¿m sáº£n pháº©m..."
            autocomplete="off"
          />
          <button type="submit" class="search-btn" aria-label="Search">
            <i class="fas fa-search"></i>
          </button>
        </form>
      </div>

      <div class="shop-promo-banner">
        <div class="promo-badge">
          <i class="fas fa-lightning-bolt"></i>
          FLASH SALE
        </div>
        <div class="promo-message">
          Giảm giá tới <strong>50%</strong> cho sản phẩm được chọn
        </div>
        <button class="promo-cta">Xem ngay</button>
      </div>

      <div class="category-brands-wrapper" id="categoryBrandsWrapper">
        <h3>Thương hiệu</h3>
        <div id="categoryBrandList" class="brand-list"></div>
      </div>

      <div class="filter-bar">
        <div class="filter-left">
          <span class="filter-label">
            <i class="fas fa-list"></i>
            <span id="filterLabel">Hiển thị tất cả sản phẩm</span>
          </span>
        </div>
        <div class="filter-right">
          <div class="filter-dropdown" id="filterDropdown">
            <button
              class="toggle-filters"
              id="toggleFilters"
              type="button"
              aria-expanded="false"
              aria-controls="advancedFilters"
            >
              <span class="toggle-filters-text">
                <i class="fas fa-sliders-h"></i>
                <span>Advanced filters</span>
              </span>
              <span class="filter-badge" id="filterBadge">0</span>
              <i class="fas fa-chevron-down"></i>
            </button>

            <div class="advanced-filters" id="advancedFilters">
              <div class="filter-dropdown-header">
                <div>
                  <h3>Filters</h3>
                  <p id="filterSummary">No filters selected</p>
                </div>
              </div>

              <div class="filter-panel-body">
                <div class="filter-section">
                  <h4>Price range <i class="fas fa-chevron-down"></i></h4>
                  <div class="filter-content">
                    <div class="price-inputs">
                      <input
                        type="number"
                        id="minPrice"
                        placeholder="Min price"
                        min="0"
                        class="price-input"
                      />
                      <span>-</span>
                      <input
                        type="number"
                        id="maxPrice"
                        placeholder="Max price"
                        min="0"
                        class="price-input"
                      />
                    </div>
                    <div class="price-presets">
                      <button
                        type="button"
                        class="price-preset"
                        data-min="0"
                        data-max="100"
                      >
                        Under $100
                      </button>
                      <button
                        type="button"
                        class="price-preset"
                        data-min="100"
                        data-max="500"
                      >
                        $100 - $500
                      </button>
                      <button
                        type="button"
                        class="price-preset"
                        data-min="500"
                        data-max="1000"
                      >
                        $500 - $1000
                      </button>
                      <button
                        type="button"
                        class="price-preset"
                        data-min="1000"
                        data-max="99999"
                      >
                        Over $1000
                      </button>
                    </div>
                  </div>
                </div>

                <div id="dynamicFilterSections"></div>
              </div>

              <div class="filter-actions">
                <button id="clearFilters" type="button" class="clear-filters">
                  Clear
                </button>
                <button id="applyFilters" type="button" class="apply-filters">
                  Apply
                </button>
              </div>
            </div>
          </div>

          <div class="sort-dropdown">
            <select
              id="sortSelect"
              class="sort-select"
              aria-label="Sáº¯p xáº¿p sáº£n pháº©m"
            >
              <option value="default">Sắp xếp: Mặc định</option>
              <option value="price-asc">Giá: Thấp đến cao</option>
              <option value="price-desc">Giá: Cao đến thấp</option>
              <option value="name-asc">Tên: A-Z</option>
              <option value="name-desc">Tên: Z-A</option>
              <option value="newest">Mới nhất</option>
            </select>
          </div>
        </div>
      </div>

      <div id="productList" class="grid-5"></div>

      <p id="emptyMessage" class="empty-message">
        <i class="fas fa-search"></i> Không tìm thấy sản phẩm phù hợp.
      </p>

      <div id="pagination" class="pagination"></div>
    </div>

    <script
      type="module"
      src="/modules/customer/features/shop/js/shop.js"
    ></script>
    <script type="module" src="/modules/customer/assets/js/header.js"></script>
    <script type="module" src="/modules/customer/assets/js/footer.js"></script>
  </body>
</html>
