<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tài khoản của tôi | TechGadget</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="/modules/customer/features/account/account.css"
    />
  </head>
  <body>
    <div class="container section-padding">
      <div class="profile-layout">
        <aside class="profile-sidebar">
          <div class="user-brief">
            <div class="avatar-sm avatar-fallback">
              <span class="profile-avatar-initial">T</span>
            </div>
            <div class="user-brief-info">
              <span class="username">Tài khoản</span>
              <span class="text-muted profile-subtitle"
                >Thông tin được đồng bộ từ hệ thống</span
              >
            </div>
          </div>

          <nav class="profile-menu">
            <div class="menu-item active" data-tab="tab-hoso">
              <i class="far fa-user"></i>
              <span class="v-label">Hồ sơ</span>
            </div>
            <div class="menu-item" data-tab="tab-donmua">
              <i class="fas fa-file-alt"></i>
              <span class="v-label">Đơn mua</span>
            </div>
          </nav>

          <button
            type="button"
            class="profile-logout-btn"
            id="accountLogoutBtn"
          >
            <i class="fas fa-right-from-bracket"></i>
            <span>Logout</span>
          </button>
        </aside>

        <main class="profile-main">
          <div id="tab-hoso" class="tab-content active">
            <div class="profile-header">
              <h2 class="section-title-slanted">Hồ sơ của tôi</h2>
            </div>

            <section class="profile-summary-card">
              <div class="profile-summary-avatar">
                <span class="profile-avatar-initial">T</span>
              </div>
              <div class="profile-summary-copy">
                <h3 class="profile-display-name">Tài khoản</h3>
                <p class="profile-email text-muted"></p>
              </div>
            </section>

            <section class="profile-details-section">
              <div id="profileDetails" class="profile-details-grid"></div>
              <div id="profileEmpty" class="empty-state" style="display: none">
                <i class="fas fa-circle-info"></i>
                <p>Hiện chưa có thêm thông tin hồ sơ để hiển thị.</p>
              </div>
            </section>
          </div>

          <div id="tab-donmua" class="tab-content">
            <div class="profile-header">
              <h2 class="section-title-slanted">Đơn mua</h2>
              <p>Theo dõi các đơn hàng đã tạo trên tài khoản của bạn.</p>
            </div>

            <div class="order-tabs-container">
              <div class="ot-item active" data-order="all">Tất cả</div>
              <div class="ot-item" data-order="pending">Chờ thanh toán</div>
              <div class="ot-item" data-order="shipping">Đang xử lý</div>
              <div class="ot-item" data-order="completed">Hoàn thành</div>
              <div class="ot-item" data-order="cancelled">Đã hủy</div>
            </div>

            <div class="order-search-bar">
              <i class="fas fa-search"></i>
              <input
                type="text"
                placeholder="Tìm theo mã đơn, trạng thái hoặc nội dung liên quan"
              />
            </div>

            <div id="order-list-content"></div>
          </div>
        </main>
      </div>
    </div>

    <script
      type="module"
      src="/modules/customer/features/account/account.js"
    ></script>
    <script type="module" src="/modules/customer/assets/js/header.js"></script>
    <script type="module" src="/modules/customer/assets/js/footer.js"></script>
  </body>
</html>
