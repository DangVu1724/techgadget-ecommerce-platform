<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Account | TechGadget</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Poppins", sans-serif;
        color: #333;
        background-color: #f5f5f5;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
      }

      .account-page {
        min-height: 100vh;
        padding: 40px 0;
      }

      .account-header {
        text-align: center;
        margin-bottom: 40px;
        padding: 30px 0;
        border-bottom: 2px solid #e0e0e0;
      }

      .account-header h1 {
        font-size: 2.5rem;
        margin-bottom: 10px;
      }

      .account-wrapper {
        display: grid;
        grid-template-columns: 1fr 3fr;
        gap: 30px;
        margin-bottom: 40px;
      }

      .account-sidebar {
        background: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        height: fit-content;
      }

      .account-sidebar h3 {
        font-size: 1.2rem;
        margin-bottom: 20px;
        padding-bottom: 10px;
        border-bottom: 2px solid #007bff;
      }

      .sidebar-menu {
        list-style: none;
      }

      .sidebar-menu li {
        margin-bottom: 10px;
      }

      .sidebar-menu a {
        display: block;
        padding: 12px 15px;
        color: #333;
        text-decoration: none;
        border-radius: 4px;
        transition: all 0.3s ease;
      }

      .sidebar-menu a:hover,
      .sidebar-menu a.active {
        background-color: #007bff;
        color: white;
      }

      .account-content {
        background: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .content-section {
        display: none;
      }

      .content-section.active {
        display: block;
      }

      .section-title {
        font-size: 1.5rem;
        margin-bottom: 20px;
        padding-bottom: 10px;
        border-bottom: 2px solid #e0e0e0;
      }

      .user-info {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 30px;
      }

      .info-item {
        padding: 15px;
        background-color: #f9f9f9;
        border-left: 4px solid #007bff;
        border-radius: 4px;
      }

      .info-label {
        font-weight: 600;
        color: #666;
        font-size: 0.9rem;
      }

      .info-value {
        font-size: 1.1rem;
        color: #333;
        margin-top: 5px;
      }

      .order-item {
        border: 1px solid #e0e0e0;
        padding: 20px;
        margin-bottom: 15px;
        border-radius: 4px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .order-info {
        flex: 1;
      }

      .order-id {
        font-weight: 600;
        margin-bottom: 5px;
      }

      .order-date {
        color: #666;
        font-size: 0.9rem;
      }

      .order-total {
        font-weight: 600;
        color: #007bff;
        font-size: 1.2rem;
        margin-right: 20px;
      }

      .order-status {
        padding: 5px 15px;
        background-color: #e8f4f8;
        color: #007bff;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: 600;
      }

      .empty-message {
        text-align: center;
        padding: 40px 20px;
        color: #999;
      }

      .mt-30 {
        margin-top: 30px;
      }

      .button-group {
        display: flex;
        gap: 15px;
        margin-top: 20px;
      }

      .btn {
        padding: 12px 30px;
        border: none;
        border-radius: 4px;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-block;
      }

      .btn-primary {
        background-color: #007bff;
        color: white;
      }

      .btn-primary:hover {
        background-color: #0056b3;
      }

      .btn-secondary {
        background-color: #6c757d;
        color: white;
      }

      .btn-secondary:hover {
        background-color: #545b62;
      }

      .btn-danger {
        background-color: #dc3545;
        color: white;
      }

      .btn-danger:hover {
        background-color: #c82333;
      }

      @media (max-width: 768px) {
        .account-wrapper {
          grid-template-columns: 1fr;
        }

        .user-info {
          grid-template-columns: 1fr;
        }

        .order-item {
          flex-direction: column;
          align-items: flex-start;
        }

        .order-total {
          margin-right: 0;
          margin-top: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="account-page">
      <div class="account-header">
        <h1>My Account</h1>
        <p>Manage your profile and orders</p>
      </div>

      <div class="container">
        <div class="account-wrapper">
          <!-- Sidebar -->
          <div class="account-sidebar">
            <h3>Menu</h3>
            <ul class="sidebar-menu">
              <li>
                <a href="#" class="menu-link active" data-section="dashboard"
                  >Dashboard</a
                >
              </li>
              <li>
                <a href="#" class="menu-link" data-section="orders"
                  >My Orders</a
                >
              </li>
              <li>
                <a href="#" class="menu-link" data-section="profile"
                  >Profile Settings</a
                >
              </li>
              <li>
                <a href="#" class="menu-link" data-section="security"
                  >Security</a
                >
              </li>
              <li><a href="#" id="logout-link" class="menu-link">Logout</a></li>
            </ul>
          </div>

          <!-- Content Area -->
          <div class="account-content">
            <!-- Dashboard Section -->
            <div class="content-section active" id="dashboard">
              <h2 class="section-title">Welcome Back!</h2>
              <div class="user-info" id="dashboard-info">
                <!-- Will be populated by JS -->
              </div>
              <div class="button-group">
                <a href="/shop" class="btn btn-primary">Continue Shopping</a>
                <a href="/cart" class="btn btn-secondary">View Cart</a>
              </div>
            </div>

            <!-- Orders Section -->
            <div class="content-section" id="orders">
              <h2 class="section-title">My Orders</h2>
              <div id="orders-list">
                <!-- Will be populated by JS -->
              </div>
            </div>

            <!-- Profile Section -->
            <div class="content-section" id="profile">
              <h2 class="section-title">Profile Settings</h2>
              <form id="profile-form" class="user-info">
                <div class="info-item">
                  <label class="info-label">Full Name</label>
                  <input
                    type="text"
                    id="fullName"
                    class="info-value"
                    style="
                      width: 100%;
                      padding: 8px;
                      border: 1px solid #ddd;
                      border-radius: 4px;
                    "
                  />
                </div>
                <div class="info-item">
                  <label class="info-label">Email</label>
                  <input
                    type="email"
                    id="email"
                    class="info-value"
                    style="
                      width: 100%;
                      padding: 8px;
                      border: 1px solid #ddd;
                      border-radius: 4px;
                    "
                    readonly
                  />
                </div>
              </form>
              <div class="button-group mt-30">
                <button id="save-profile" class="btn btn-primary">
                  Save Changes
                </button>
              </div>
            </div>

            <!-- Security Section -->
            <div class="content-section" id="security">
              <h2 class="section-title">Change Password</h2>
              <form id="security-form" style="max-width: 400px">
                <div
                  class="info-item"
                  style="display: block; margin-bottom: 15px"
                >
                  <label class="info-label">Current Password</label>
                  <input
                    type="password"
                    id="currentPassword"
                    style="
                      width: 100%;
                      padding: 8px;
                      border: 1px solid #ddd;
                      border-radius: 4px;
                      margin-top: 5px;
                    "
                  />
                </div>
                <div
                  class="info-item"
                  style="display: block; margin-bottom: 15px"
                >
                  <label class="info-label">New Password</label>
                  <input
                    type="password"
                    id="newPassword"
                    style="
                      width: 100%;
                      padding: 8px;
                      border: 1px solid #ddd;
                      border-radius: 4px;
                      margin-top: 5px;
                    "
                  />
                </div>
                <div
                  class="info-item"
                  style="display: block; margin-bottom: 15px"
                >
                  <label class="info-label">Confirm Password</label>
                  <input
                    type="password"
                    id="confirmPassword"
                    style="
                      width: 100%;
                      padding: 8px;
                      border: 1px solid #ddd;
                      border-radius: 4px;
                      margin-top: 5px;
                    "
                  />
                </div>
              </form>
              <div class="button-group mt-30">
                <button id="change-password" class="btn btn-primary">
                  Change Password
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script
      type="module"
      src="/modules/customer/features/account/account.js"
    ></script>
    <script type="module" src="/modules/customer/assets/js/header.js"></script>
    <script type="module" src="/modules/customer/assets/js/footer.js"></script>
  </body>
</html>
