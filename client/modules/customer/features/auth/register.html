<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - TechGadget</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/modules/customer/features/auth/styles.css" />
  </head>

  <body>
    <div class="card register">
      <div class="form-side">
        <div class="logo">TechGadget</div>

        <h1>Create Account</h1>
        <p class="subtitle">Experience the best tech shopping adventure</p>

        <form id="registerForm">

          <div class="grid-inputs">
            <div class="input-group">
              <label>First Name</label>
              <input id="firstName" type="text" placeholder="John" required />
            </div>

            <div class="input-group">
              <label>Last Name</label>
              <input id="lastName" type="text" placeholder="Doe" required />
            </div>
          </div>

          <div class="input-group">
            <label>Email</label>
            <input
              id="registerEmail"
              type="email"
              placeholder="example@gmail.com"
              required
            />
          </div>

          <div class="input-group">
            <label>Password</label>
            <input
              id="registerPassword"
              type="password"
              placeholder="At least 8 characters"
              required
            />
          </div>

          <div class="checkbox-row">
            <input type="checkbox" id="tos" required />
            <label for="tos">I agree to the Terms of Service</label>
          </div>

          <button type="submit" class="btn">SIGN UP NOW</button>
        </form>

        <p class="footer-link">
          Already have an account? <a href="/login">Log in here</a>
        </p>
      </div>

      <div class="image-side">
        <img src="/modules/customer/assets/images/logo.png" alt="Register" />
      </div>
    </div>

    <script
      src="/modules/customer/features/auth/auth.js"
      type="module"
    ></script>
  </body>
</html>
