
<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - TechGadget</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/modules/customer/features/auth/styles.css" />
  </head>

  <body>
    <div class="card login">
      <div class="form-side">
        <div class="logo">TechGadget</div>

        <h1>Login</h1>
        <p class="subtitle">Welcome back!</p>

        <form id="loginForm">
          <div class="input-group">
            <label>Email</label>
            <input
              id="loginEmail"
              type="email"
              placeholder="name@company.com"
              required
            />
          </div>

          <div class="input-group">
            <div class="flex-row">
              <label>Password</label>
              <a href="#" style="font-size: 12px">Forgot password?</a>
            </div>
            <input
              id="loginPassword"
              type="password"
              placeholder="••••••••"
              required
            />
          </div>

          <button type="submit" class="btn">LOGIN</button>
        </form>

        <p class="footer-link">
          Don't have an account? <a href="/register">Sign up now</a>
        </p>
      </div>

      <div class="image-side">
        <img
          src="/modules/customer/assets/images/logo.png"
          alt="Login"
        />
      </div>
    </div>

    <script
      src="/modules/customer/features/auth/auth.js"
      type="module"
    ></script>
  </body>
</html>
