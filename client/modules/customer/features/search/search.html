<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search - TechGadget</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="/modules/customer/features/search/search.css"
    />
  </head>
  <body>
    <div id="relatedProductsModal" class="modal-overlay" style="display: none">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modalTitle">Related Products</h2>
          <button class="modal-close" aria-label="Close">
            <i class="fas fa-times"></i>
          </button>
        </div>
        <div id="relatedProductsGrid" class="modal-products-grid"></div>
      </div>
    </div>

    <div class="search-page-container">
      <div class="container-inner">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="/">
            <i class="fas fa-home"></i>
          </a>
          <span>/</span>
          <span>Search: <strong id="search-keyword"></strong></span>
        </nav>

        <div class="search-header">
          <h1>Search results</h1>
          <div class="search-info">
            <p>Found <strong id="results-count">0</strong> products</p>
            <div class="search-box">
              <form id="search-form">
                <input
                  type="text"
                  id="search-input"
                  placeholder="Search products..."
                  autocomplete="off"
                />
                <button type="submit" class="search-btn">
                  <i class="fas fa-search"></i>
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>

      <!-- Layout Full Width - Banner cố định 2 bên mép -->
      <div class="search-layout">
        <!-- Banner quảng cáo bên trái - fixed mép trái -->
        <div class="ad-banner-left">
          <div class="ad-banner left" id="bannerLeft">
            <button class="banner-toggle" onclick="toggleBanner('left')">
              ×
            </button>
            <img
              src="https://picsum.photos/240/400?random=1"
              alt="Flash Sale"
            />
            <div class="ad-content">
              <h4>FLASH SALE</h4>
              <div class="discount">-50%</div>
              <p>Flash sale</p>
              <a href="/flash-sale" class="btn-shop">Buy now →</a>
            </div>
          </div>
        </div>

        <!-- Banner quảng cáo bên phải - fixed mép phải -->
        <div class="ad-banner-right">
          <div class="ad-banner right" id="bannerRight">
            <button class="banner-toggle" onclick="toggleBanner('right')">
              ×
            </button>
            <img src="https://picsum.photos/240/400?random=2" alt="Free Ship" />
            <div class="ad-content">
              <h4>FREE SHIP</h4>
              <p>Order from 500k</p>
              <p>Applicable nationwide</p>
              <a href="/shipping" class="btn-shop">View details →</a>
            </div>
          </div>
        </div>

        <!-- Nội dung chính -->
        <div class="main-content">
          <main class="search-results">
            <div class="sort-options">
              <label for="sort-select">Sort by:</label>
              <select id="sort-select">
                <option value="relevance">Most Relevant</option>
                <option value="price-asc">Price: Low to High</option>
                <option value="price-desc">Price: High to Low</option>
                <option value="newest">Newest</option>
                <option value="popular">Most Popular</option>
              </select>
            </div>

            <div id="productGrid" class="product-grid"></div>

            <div id="loading" class="loading" style="display: none">
              <i class="fas fa-spinner"></i>
              <p>Loading...</p>
            </div>

            <div id="emptyState" class="empty-state" style="display: none">
              <i class="fas fa-search"></i>
              <h3>No products found</h3>
              <p>Try different keywords or change the sorting method</p>
              <a href="/shop" class="btn-back">Back to Shop</a>
            </div>

            <div id="pagination" class="pagination"></div>
          </main>
        </div>
      </div>
    </div>

    <script>
      // Toggle banner
      function toggleBanner(side) {
        const banner = document.getElementById(
          `banner${side === "left" ? "Left" : "Right"}`,
        );
        banner.classList.toggle("closed");
      }
    </script>
    <script
      type="module"
      src="/modules/customer/features/search/search.js"
    ></script>
    <script type="module" src="/modules/customer/assets/js/header.js"></script>
    <script type="module" src="/modules/customer/assets/js/footer.js"></script>
    <button id="backToTop" title="Lên đầu trang">
  <span class="arrow"></span>
</button>
  </body>
</html>
