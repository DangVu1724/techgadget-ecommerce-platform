<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tìm kiếm - TechGadget</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Poppins:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="/modules/customer/features/search/search.css" />
  </head>
  <body>
    <!-- Modal: Related Products -->
    <div id="relatedProductsModal" class="modal-overlay" style="display: none">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modalTitle">Sản phẩm liên quan</h2>
          <button class="modal-close" aria-label="Close">
            <i class="fas fa-times"></i>
          </button>
        </div>
        <div id="relatedProductsGrid" class="modal-products-grid"></div>
      </div>
    </div>

    <div class="search-page-container container">
      <!-- Breadcrumb -->
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="/">
          <i class="fas fa-home"></i>
        </a>
        <span>/</span>
        <span>Tìm kiếm: <strong id="search-keyword"></strong></span>
      </nav>

      <!-- Search Results Header -->
      <div class="search-header">
        <h1>Kết quả tìm kiếm</h1>
        <div class="search-info">
          <p>Tìm thấy <strong id="results-count">0</strong> sản phẩm</p>
          <div class="search-box">
            <form id="search-form">
              <input
                type="text"
                id="search-input"
                placeholder="Tìm kiếm sản phẩm..."
                autocomplete="off"
              />
              <button type="submit" class="search-btn">
                <i class="fas fa-search"></i>
              </button>
            </form>
          </div>
        </div>
      </div>

      <!-- Filter Sidebar -->
      <div class="search-layout search-container">
        <aside class="filter-sidebar">
          <!-- Price Filter -->
          <div class="filter-section">
            <h3>Khoảng giá</h3>
            <div class="filter-content">
              <div class="price-inputs">
                <input
                  type="number"
                  id="minPrice"
                  placeholder="Từ"
                  min="0"
                  class="price-input"
                />
                <span>-</span>
                <input
                  type="number"
                  id="maxPrice"
                  placeholder="Đến"
                  min="0"
                  class="price-input"
                />
              </div>
              <div class="price-presets">
                <button class="price-preset" data-min="0" data-max="100">
                  Dưới $100
                </button>
                <button class="price-preset" data-min="100" data-max="500">
                  $100 - $500
                </button>
                <button class="price-preset" data-min="500" data-max="1000">
                  $500 - $1000
                </button>
                <button class="price-preset" data-min="1000" data-max="99999">
                  Trên $1000
                </button>
              </div>
            </div>
          </div>

          <!-- Category Filter -->
          <div class="filter-section">
            <h3>Danh mục</h3>
            <div id="categoryList" class="filter-content category-list"></div>
          </div>

          <!-- Brand Filter -->
          <div class="filter-section">
            <h3>Thương hiệu</h3>
            <div id="brandList" class="filter-content brand-list"></div>
          </div>

          <!-- RAM Filter -->
          <div class="filter-section">
            <h3>RAM</h3>
            <div class="filter-content">
              <label class="checkbox-label">
                <input type="checkbox" value="4" class="ram-filter" /> 4GB
              </label>
              <label class="checkbox-label">
                <input type="checkbox" value="8" class="ram-filter" /> 8GB
              </label>
              <label class="checkbox-label">
                <input type="checkbox" value="16" class="ram-filter" /> 16GB
              </label>
              <label class="checkbox-label">
                <input type="checkbox" value="32" class="ram-filter" /> 32GB+
              </label>
            </div>
          </div>

          <!-- Clear Filters -->
          <button id="clearFilters" class="btn-clear-filters">
            <i class="fas fa-redo"></i> Xóa bộ lọc
          </button>
        </aside>

        <!-- Search Results -->
        <main class="search-results">
          <!-- Sort Options -->
          <div class="sort-options">
            <label for="sort-select">Sắp xếp:</label>
            <select id="sort-select">
              <option value="relevance">Liên quan nhất</option>
              <option value="price-asc">Giá: Thấp → Cao</option>
              <option value="price-desc">Giá: Cao → Thấp</option>
              <option value="newest">Mới nhất</option>
              <option value="popular">Phổ biến nhất</option>
            </select>
          </div>

          <!-- Products Grid -->
          <div id="productGrid" class="product-grid"></div>

          <!-- Loading Spinner -->
          <div id="loading" class="loading" style="display: none">
            <i class="fas fa-spinner"></i>
            <p>Đang tải...</p>
          </div>

          <!-- Empty State -->
          <div id="emptyState" class="empty-state" style="display: none">
            <i class="fas fa-search"></i>
            <h3>Không tìm thấy sản phẩm</h3>
            <p>Hãy thử tìm kiếm từ khác hoặc điều chỉnh bộ lọc của bạn</p>
            <a href="/shop" class="btn-back">Quay lại cửa hàng</a>
          </div>

          <!-- Pagination -->
          <div id="pagination" class="pagination"></div>
        </main>
      </div>
    </div>

    <script type="module" src="/modules/customer/features/search/search.js"></script>
   <script type="module" src="/modules/customer/assets/js/header.js"></script>
    <script type="module" src="/modules/customer/assets/js/footer.js"></script>
  </body>
</html>
