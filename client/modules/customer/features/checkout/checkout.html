<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout | TechGadget</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />

    <link
      rel="stylesheet"
      href="/modules/customer/features/checkout/checkout.css"
    />
  </head>
  <body>
    <div class="checkout-page">
      <!-- Header -->
      <div class="checkout-header-section">
        <div>
          <h1>CHECKOUT</h1>
          <p>
            <a href="/home" style="color: #888; text-decoration: none">Home</a>
            >
            <a href="/cart" style="color: #888; text-decoration: none">Cart</a>
            >
            <span style="color: #333; font-weight: 600">Checkout</span>
          </p>
        </div>
      </div>

      <div class="container">
        <div class="checkout-wrapper">
          <!-- LEFT: FORM -->
          <div class="checkout-form-section">
            <!-- Billing Information -->
            <div class="form-section">
              <h3 class="section-title">BILLING INFORMATION</h3>
              <form id="checkout-form">
                <div class="form-group">
                  <label for="fullName">Full Name *</label>
                  <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    required
                    placeholder="Enter your full name"
                  />
                </div>

                <div class="form-row">
                  <div class="form-group">
                    <label for="email">Email *</label>
                    <input
                      type="email"
                      id="email"
                      name="email"
                      required
                      placeholder="Enter your email"
                    />
                  </div>
                  <div class="form-group">
                    <label for="phone">Phone *</label>
                    <input
                      type="tel"
                      id="phone"
                      name="phone"
                      required
                      placeholder="Enter your phone number"
                    />
                  </div>
                </div>

                <div class="form-group">
                  <label for="address">Address *</label>
                  <input
                    type="text"
                    id="address"
                    name="address"
                    required
                    placeholder="Enter your street address"
                  />
                </div>

                <div class="form-group">
                  <label for="notes">Order Notes (Optional)</label>
                  <textarea
                    id="notes"
                    name="notes"
                    placeholder="Add special instructions for your order"
                    rows="4"
                  ></textarea>
                </div>

                <!-- Payment Method -->
                <div class="form-section">
                  <h3 class="section-title">PAYMENT METHOD</h3>

                  <div class="payment-options">
                    <label class="payment-option">
                      <input
                        type="radio"
                        name="paymentMethod"
                        value="COD"
                        checked
                      />
                      <span class="radio-custom"></span>
                      <div class="payment-info">
                        <span class="payment-name">Cash on Delivery (COD)</span>
                        <span class="payment-desc"
                          >Pay when your order arrives</span
                        >
                      </div>
                    </label>

                    <label class="payment-option">
                      <input type="radio" name="paymentMethod" value="PAYOS" />
                      <span class="radio-custom"></span>
                      <div class="payment-info">
                        <span class="payment-name">PayOS</span>
                        <span class="payment-desc"
                          >Fast and secure online payment</span
                        >
                      </div>
                    </label>
                  </div>
                </div>

                <button type="submit" class="btn-checkout-submit">
                  PLACE ORDER
                </button>
              </form>
            </div>
          </div>

          <!-- RIGHT: ORDER SUMMARY -->
          <div class="checkout-summary-section">
            <div class="order-summary">
              <h3 class="summary-title">ORDER SUMMARY</h3>

              <!-- Products -->
              <div class="summary-items">
                <div id="order-items-container">
                  <!-- Items will be rendered here -->
                </div>
              </div>

              <!-- Divider -->
              <div class="summary-divider"></div>

              <!-- Totals -->
              <div class="summary-totals">
                <div class="total-row">
                  <span>Subtotal</span>
                  <span id="summary-subtotal">$0.00</span>
                </div>
                <div class="total-row">
                  <span>Shipping</span>
                  <span id="summary-shipping">$0.00</span>
                </div>
                <div class="total-row main-total">
                  <span>Total</span>
                  <span id="summary-total">$0.00</span>
                </div>
              </div>

              <!-- Return to Cart -->
              <a href="/cart" class="btn-back-to-cart">← Back to Cart</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script
      type="module"
      src="/modules/customer/features/checkout/js/checkout.js"
    ></script>
    <script type="module" src="/modules/customer/assets/js/header.js"></script>
    <script type="module" src="/modules/customer/assets/js/footer.js"></script>
  </body>
</html>
