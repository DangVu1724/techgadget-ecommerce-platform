<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart | TechGadget</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />

    <link rel="stylesheet" href="/modules/customer/features/cart/cart.css" />
  </head>
  <body>
    <div class="cart-page">
      <div class="cart-header-section">
        <div>
          <h1>CART</h1>
          <p><a href="/home" style="color: #888; text-decoration: none; transition: 0.2s;">Home</a> > <span style="color: #333; font-weight: 600;">Cart</span></p>
        </div>
      </div>

      <div class="container">
        <div class="cart-table">
          <div class="slanted-divider"></div>
            <div class="cart-thead">
              <div class="col-product">PRODUCT</div>
              <div class="col-qty">QUANTITY</div>
              <div class="col-subtotal">SUBTOTAL</div>
            </div>

            <div class="slanted-divider"></div>

            <div id="cart-items-container">
              <!-- Cart items sẽ được render từ JavaScript -->
            </div>
          </div>

          <div class="cart-totals-section">
            <h3>CART TOTALS</h3>
            <div class="total-row">
              <span>SUBTOTAL</span>
              <span class="price-val" id="cart-subtotal">0 VND</span>
            </div>
            <div class="total-row main-total">
              <span>TOTAL</span>
              <span class="price-val" id="cart-total">0 VND</span>
            </div>
          </div>

          <div class="cart-actions">
            <button class="btn-cart-secondary" id="btn-continue-shopping">
              CONTINUE SHOPPING
            </button>
            <button class="btn-cart-primary" id="btn-checkout">
              PROCEED TO CHECKOUT
            </button>
          </div>
        </div>
      </div>
    </div>

    <script
      type="module"
      src="/modules/customer/features/cart/js/cart.js"
    ></script>
    <script
      type="module"
      src="/modules/customer/features/product-detail/js/product-detail.js"
    ></script>
    <script
      type="module"
      src="/modules/customer/components/footer/footer.html"
    ></script>
    <script
      type="module"
      src="/modules/customer/components/header/header.html"
    ></script>
    <script type="module" src="/modules/customer/assets/js/header.js"></script>
    <script type="module" src="/modules/customer/assets/js/footer.js"></script>
  <button id="backToTop" title="Lên đầu trang">
  <span class="arrow"></span>
  </button>
  </body>
</html>
