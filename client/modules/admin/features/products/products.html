<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products - Admin Panel</title>
    <link
      rel="stylesheet"
      href="../../components/layouts/sidebar/sidebar.css"
    />
    <link
      rel="stylesheet"
      href="/client/modules/admin/components/data/table/table.css"
    />
    <link
      rel="stylesheet"
      href="/client/modules/admin/components/layouts/css/header.css"
    />
    <link
      rel="stylesheet"
      href="/client/modules/admin/components/layouts/css/layout.css"
    />
    <link
      rel="stylesheet"
      href="/client/modules/admin/components/layouts/css/modal.css"
    />
    <style>
      .price {
        font-weight: 600;
        color: #28a745;
      }

      .stock-badge {
        padding: 4px 8px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 500;
      }

      .stock-badge.high {
        background: #d4edda;
        color: #155724;
      }

      .stock-badge.medium {
        background: #fff3cd;
        color: #856404;
      }

      .stock-badge.low {
        background: #f8d7da;
        color: #721c24;
      }

      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div id="sidebar-container"></div>

      <main class="main-content">
        <header class="top-header">
          <div class="header-left">
            <div class="page-title">
              <h1>Products Management</h1>
            </div>
          </div>
          <div class="header-right">
            <div class="user-dropdown" id="userDropdown">
              <div class="avatar" id="userAvatar">A</div>
              <span id="userName">Loading...</span>
            </div>
          </div>
        </header>

        <div class="content-wrapper">
          <div id="table-container" class="table-wrapper"></div>
        </div>
      </main>
    </div>

    <script
      type="module"
      src="/client/modules/admin/features/products/products.js"
    ></script>
  </body>
</html>
