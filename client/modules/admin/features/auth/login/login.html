<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - E-Commerce</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">A</div>
                <h1>Welcome Back!</h1>
                <p>Sign in to continue to Admin Dashboard</p>
            </div>

            <!-- Alert Container -->
            <div id="alertContainer"></div>

            <!-- Login Form -->
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-icon">
                        <i>👤</i>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            placeholder="Enter your username"
                            autocomplete="off"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-icon">
                        <i>🔒</i>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Enter your password"
                            required
                        >
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" id="loginBtn" class="login-btn">
                    Sign In
                </button>
            </form>

            <!-- Demo Accounts -->
            <div class="demo-accounts">
                <h3>Demo Accounts</h3>
                <div class="demo-accounts-grid">
                    <button class="demo-account-btn" data-username="admin" data-password="admin123">
                        <div class="role">Administrator</div>
                        <div class="credentials">
                            <span>admin</span> / admin123
                        </div>
                    </button>
                    <button class="demo-account-btn" data-username="manager" data-password="manager123">
                        <div class="role">Manager</div>
                        <div class="credentials">
                            <span>manager</span> / manager123
                        </div>
                    </button>
                </div>
            </div>
        </div>
    </div>


    <script type="module" src="login.js"></script>
</body>
</html>
